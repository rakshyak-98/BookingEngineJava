spring:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  datasource:
    url: jdbc:h2:mem:booking_engine_test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/booking_engine_test

logging:
  level:
    root: INFO
    com.booking.engine: DEBUG
