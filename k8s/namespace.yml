apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    name: production
    environment: production

---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    name: staging
    environment: staging

---
apiVersion: v1
kind: Namespace
metadata:
  name: development
  labels:
    name: development
    environment: development

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booking-engine
  namespace: production
  labels:
    app: booking-engine

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: booking-engine-role
  namespace: production
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: booking-engine-rolebinding
  namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: booking-engine-role
subjects:
- kind: ServiceAccount
  name: booking-engine
  namespace: production
