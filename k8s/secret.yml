apiVersion: v1
kind: Secret
metadata:
  name: booking-engine-secret
  namespace: production
  labels:
    app: booking-engine
type: Opaque
stringData:
  # Database Credentials (CHANGE THESE IN PRODUCTION)
  db.username: "booking_user"
  db.password: "change-me-in-production"

  # MongoDB Credentials
  mongodb.uri: "mongodb://user:password@booking-engine-mongodb.default.svc.cluster.local:27017/booking_engine"

  # AWS Credentials (use IAM roles instead in production)
  aws.access-key-id: "AKIA_CHANGE_ME"
  aws.secret-access-key: "change-me-in-production"

  # JWT Secret
  jwt.secret: "your-secret-key-change-in-production-make-it-very-long-and-secure"

  # Docker Registry Credentials (for pulling images)
  docker-registry-username: "change-me"
  docker-registry-password: "change-me"
  docker-registry-email: "change-me"

  # Email Configuration
  email.username: "noreply@booking-engine.com"
  email.password: "change-me-in-production"
  email.smtp.host: "smtp.gmail.com"
  email.smtp.port: "587"

  # Slack Webhook (for notifications)
  slack.webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: production
type: kubernetes.io/dockercfg
dockercfg: |
  {
    "<aws-account-id>.dkr.ecr.us-east-1.amazonaws.com": {
      "auth": "base64-encoded-auth-token"
    }
  }
